<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X Likes Automator</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="masthead">
      <p class="eyebrow">Sessão nesta aba</p>
      <h1>X Likes Automator</h1>
    </header>

    <p id="status" role="status" aria-live="polite">Parado</p>
    <p id="count">Curtidas nesta sessão: 0</p>
    <p class="hint">A curtida para quando você sai desta aba do X.</p>

    <form id="settings">
      <div class="field">
        <label for="interval">Intervalo entre curtidas (segundos)</label>
        <input id="interval" type="number" min="1" max="60" step="1" value="5" inputmode="numeric" required>
      </div>

      <div class="field check-field">
        <input id="unlimited" type="checkbox" checked>
        <label for="unlimited">Sem limite de curtidas</label>
      </div>

      <div class="field">
        <label for="cap">Limite de curtidas nesta sessão</label>
        <input id="cap" type="number" min="1" max="1000000" step="1" value="100" inputmode="numeric">
      </div>

      <div class="field check-field">
        <input id="like-original" type="checkbox" checked>
        <label for="like-original">Curtir o post original em uma thread de resposta</label>
      </div>

      <div class="field check-field">
        <input id="also-repost" type="checkbox" checked>
        <label for="also-repost">Repostar também</label>
      </div>

      <div class="field">
        <label for="interface-language">Idioma da interface</label>
        <select id="interface-language">
          <option value="pt-BR" selected>Português (Brasil)</option>
          <option value="en">English</option>
          <option value="ar">ar · أعجبني</option>
          <option value="ar-x-fm">ar-x-fm · أعجبني</option>
          <option value="bg">bg · Харесване</option>
          <option value="bn">bn · পছন্দ করুন</option>
          <option value="ca">ca · M'agrada</option>
          <option value="cs">cs · Lajknout</option>
          <option value="da">da · Like</option>
          <option value="de">de · Gefällt mir</option>
          <option value="el">el · Σήμανση "Μου αρέσει"</option>
          <option value="en-GB">en-GB · Like</option>
          <option value="es">es · Me gusta</option>
          <option value="eu">eu · Atsegin</option>
          <option value="fa">fa · پسندیدن</option>
          <option value="fi">fi · Tykkää</option>
          <option value="fil">fil · Gustuhin</option>
          <option value="fr">fr · Aimer</option>
          <option value="ga">ga · Thaitin seo le</option>
          <option value="gl">gl · Gústame</option>
          <option value="gu">gu · લાઈક</option>
          <option value="he">he · סמן כאהוב</option>
          <option value="hi">hi · पसंद करें</option>
          <option value="hr">hr · Označi sa "sviđa mi se"</option>
          <option value="hu">hu · Kedvelés</option>
          <option value="id">id · Suka</option>
          <option value="ig">ig · Mmasị</option>
          <option value="it">it · Metti Mi piace</option>
          <option value="ja">ja · いいね</option>
          <option value="kn">kn · ಇಷ್ಟಪಡಿ</option>
          <option value="ko">ko · 마음에 들어요</option>
          <option value="mr">mr · पसंत केले</option>
          <option value="ms">ms · Suka</option>
          <option value="nb">nb · Liker</option>
          <option value="nl">nl · Leuk</option>
          <option value="pl">pl · Lubię</option>
          <option value="ro">ro · Apreciază</option>
          <option value="ru">ru · Нравится</option>
          <option value="sk">sk · Páči sa</option>
          <option value="sr">sr · Свиђа ми се</option>
          <option value="sv">sv · Gilla</option>
          <option value="ta">ta · விரும்பு</option>
          <option value="th">th · ชื่นชอบ</option>
          <option value="tr">tr · Beğen</option>
          <option value="uk">uk · Вподобати</option>
          <option value="vi">vi · Thích</option>
          <option value="yo">yo · Fẹ́rán</option>
          <option value="zh">zh · 喜欢</option>
          <option value="zh-Hant">zh-Hant · 喜歡</option>
        </select>
      </div>

      <p id="form-error" role="alert"></p>

      <div class="actions">
        <button id="start" type="button">Iniciar</button>
        <button id="stop" type="button" hidden>Parar</button>
      </div>
    </form>

    <script src="../lib/ui-languages.js"></script>
    <script src="../lib/policy.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
